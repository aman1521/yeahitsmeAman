[build]
  publish = "."

# Admin route shortcuts for easy login
[[redirects]]
  from = "/admin"
  to = "/ecommerce-dashboard/login"
  status = 302

[[redirects]]
  from = "/admin/"
  to = "/ecommerce-dashboard/login"
  status = 302

[[redirects]]
  from = "/admin/*"
  to = "/ecommerce-dashboard/index.html"
  status = 200

# Ecommerce Dashboard SPA Rewrite
[[redirects]]
  from = "/ecommerce-dashboard/*"
  to = "/ecommerce-dashboard/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

