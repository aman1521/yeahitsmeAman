[build]
  publish = "."

# Privacy policy clean URLs
[[redirects]]
  from = "/privacy"
  to = "/privacy-policy.html"
  status = 200

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.html"
  status = 200

# Terms and Conditions clean URLs
[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/terms-of-service"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/terms-and-conditions"
  to = "/terms.html"
  status = 200

# Admin route shortcuts for easy login
[[redirects]]
  from = "/admin"
  to = "/ecommerce-dashboard/login"
  status = 302

[[redirects]]
  from = "/admin/"
  to = "/ecommerce-dashboard/login"
  status = 302

[[redirects]]
  from = "/admin/*"
  to = "/ecommerce-dashboard/index.html"
  status = 200

# Ecommerce Dashboard SPA Rewrite
[[redirects]]
  from = "/ecommerce-dashboard/*"
  to = "/ecommerce-dashboard/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

